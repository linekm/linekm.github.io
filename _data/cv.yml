    Research Interests:
      - Oblivious query processing for data federation and outsourced cloud computing.
      - Scalable secure query processing for vector databases based on Trusted Execution Environments.
      - Robust updatable learned indexes under real-world workloads.
      - Distributed vector database design.

    Research Projects:
      - name: "FedKNN: Secure Federated k-Nearest Neighbor Search"
        venue: SIGMOD '24
        highlights:
          - Proposed FedKNN, a system for secure and privacy-preserving federated kNN search, achieving up to 4.8× efficiency improvement over SOTA by optimizing local computations with a distribution-aware algorithm.
      - name: "HIRE: A Hybrid Learned Index for Robust and Efficient Performance"
        venue: SIGMOD '26
        highlights:
          - Designed HIRE, a hybrid in-memory index combining learned predictions with traditional robustness, reducing tail latency by 98% and improving throughput by 41.7× compared to SOTA approaches.
      - name: Privacy-Preserving Approximate Nearest Neighbor Search
        venue: Under Review
        highlights:
          - Proposed a secure ANN index structure within trusted execution environments, mitigating side-channel attacks by enforcing oblivious memory access patterns on proximity graph indexes.
          - Achieved plaintext-level throughput with provable privacy guarantees via a distribution-aware oblivious access algorithm, significantly outperforming SOTA solutions.
      - name: Authenticated Approximate Nearest Neighbor Search
        venue: Under Revision (SIGMOD)
        highlights:
          - Designed VIDA, a scheme for authenticated graph-based ANN search that leverages vector commitments and Inner Product Arguments to verify distance computations, drastically reducing data transmission size.
          - Introduced MeST, a proof aggregation mechanism that compresses the verification of multiple vectors into a single cryptographic proof; achieved up to 5.2× end-to-end speedup and 99.3% reduction in data transfer time.

